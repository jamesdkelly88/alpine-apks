jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          path: source

      - name: Checkout pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages

      - name: Setup Alpine Linux v3.23
        uses: jirutka/setup-alpine@v1
        with:
          branch: v3.23

      - name: File list check
        run: ls -lR .
        shell: alpine.sh {0}

      # - name: Get OS Version
      #   run: cat /etc/os-release
      #   shell: alpine.sh {0}

      - name: Install and configure abuild
        run: |
          apk add alpine-sdk
          addgroup runner abuild
        shell: alpine.sh --root {0}

      - name: Store RSA Keys
        run: |
          echo "$RSA_PRIVATE_KEY" > "$HOME/$GITHUB_REPOSITORY_OWNER.rsa"
          echo "$RSA_PUBLIC_KEY" > "$HOME/$GITHUB_REPOSITORY_OWNER.rsa.pub"
          cp "$HOME/$GITHUB_REPOSITORY_OWNER.rsa.pub" /etc/apk/keys
        shell: alpine.sh --root {0}
        env:
          RSA_PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
          RSA_PUBLIC_KEY: ${{ secrets.RSA_PUBLIC_KEY }}

      - name: Test abuild
        run: |
          export REPODEST="$HOME/output"
          export PACKAGER_PRIVKEY="$HOME/$GITHUB_REPOSITORY_OWNER.rsa"

          cd source/packages/postgresql18-age

          abuild -r

        shell: alpine.sh {0}
        env:
          PACKAGER: James Kelly <jamesdkelly88@outlook.com>

      - name: Check results
        run: ls -lR $HOME/output
        shell: alpine.sh {0}

      - name: Test GH page update
        run: |
          git checkout --progress --force -B "$GH_PAGES_BRANCH" refs/remotes/origin/"$GH_PAGES_BRANCH"
          ls -alR
          echo "<p>This came from an action</p>" > index.html

          git add .
          git -c user.name="$GITHUB_ACTOR" -c user.email="$GITHUB_ACTOR@users.noreply.github.com" commit -m "Update packages" && \
          git push origin "$GH_PAGES_BRANCH" || echo Nothing to commit
        shell: alpine.sh {0}
        env:
          GH_PAGES_BRANCH: gh-pages

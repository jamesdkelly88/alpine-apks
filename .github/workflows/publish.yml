name: Publish

on:
  push:
    branches:
      - draft

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ivanvc/abuild-releaser-action@v1.1.0
        with:
          author: James Kelly <jamesdkelly88@outlook.com>
          rsa_public_key: ${{ secrets.RSA_PUBLIC_KEY }}
          rsa_private_key: ${{ secrets.RSA_PRIVATE_KEY }}
          generate_index_pages: true
          generate_single_index_page: false
          alpine_branch: v3.23
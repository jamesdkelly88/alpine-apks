jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  

      - name: Setup Alpine Linux v3.23
        uses: jirutka/setup-alpine@v1
        with:
          branch: v3.23

      - name: Get OS Version
        run: cat /etc/os-release
        shell: alpine.sh {0}

      - name: Install abuild
        run: apk add alpine-sdk
        shell: alpine.sh --root {0}

      - name: Add runner user to abuild group
        run: addgroup runner abuild
        shell: alpine.sh --root {0}

      - name: Test abuild
        run: abuild -V
        shell: alpine.sh {0}